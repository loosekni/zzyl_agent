[project]
name = "zzyl-agent-backend"
version = "0.1.0"
description = "FastAPI and LangGraph backend for ZZYL agent workflows"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.4.0",
  "sqlmodel>=0.0.22",
  "alembic>=1.13.0",
  "langchain>=0.3.0",
  "langgraph>=0.2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
